# Termostato per fermentatore con scheda ESP32 + relè (AliExpress "ESP32 relay AC90-250V 1 channel", ESP32-WROOM),
# al posto dell'Inkbird STC-1000 di FV6 e FV7. Pacchetto comune: le differenze tra FV stanno in fv6.yaml / fv7.yaml.
#
# Cosa fa:
#   - legge la sonda NTC 10k dell'STC-1000 (B ≈ 3435) con un partitore da 10 kΩ sull'ingresso analogico
#   - comanda il freddo (relè → elettrovalvola/pompa del glicole) con isteresi e tempo minimo di spegnimento
#   - SICUREZZA: se la sonda è scollegata, in corto o fuori campo, il relè si spegne e resta spento
#   - display OLED 0,96" (SSD1306 I2C 0x3C): nome FV, temperatura, setpoint, freddo acceso/spento
#   - pagina web (http://fv6.local) per vedere i valori e cambiare il setpoint; il gateway la legge ogni 15 s
#   - funziona anche senza Wi-Fi: il controllo della temperatura è tutto sulla scheda
#
# Collegamento della sonda (partitore):   3V3 ── resistenza 10 kΩ 1% ──┬── ${pin_ntc} (ingresso analogico)
#                                                                       └── sonda NTC ── GND
#
# Primo caricamento con l'adattatore USB-seriale (vedi GUIDA-TEMPERATURE.md):
#   esphome run fv6.yaml        (poi gli aggiornamenti passano via Wi-Fi)

esphome:
  name: ${nome}
  friendly_name: ${nome_fv}
  comment: "Termostato ${nome_fv} (freddo glicole)"
  on_boot:
    priority: 600
    then:
      - switch.turn_off: rele   # all'accensione il freddo parte spento

esp32:
  board: esp32dev
  framework:
    type: arduino

# Niente Home Assistant: senza "api:" la scheda non si riavvia quando nessuno la interroga.
logger:
  level: INFO

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s          # senza Wi-Fi NON si riavvia: il termostato continua a lavorare
  ap:                         # se non trova la rete apre una rete propria per configurarla dal telefono
    ssid: "${nome_fv} configurazione"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80
  version: 3
  auth:
    username: !secret web_utente
    password: !secret web_password

status_led:
  pin:
    number: ${pin_led}
    inverted: ${led_invertito}

# ---------- sonda NTC ----------
sensor:
  - platform: adc
    id: tensione_ntc
    pin: ${pin_ntc}
    attenuation: 12db
    update_interval: 1s
    internal: true
    filters:
      - median:
          window_size: 5
          send_every: 1

  - platform: resistance
    id: resistenza_ntc
    sensor: tensione_ntc
    configuration: DOWNSTREAM   # sonda tra ingresso e GND, resistenza fissa verso 3V3
    resistor: 10kOhm
    reference_voltage: 3.3V
    internal: true

  - platform: ntc
    id: temperatura
    name: temperatura
    sensor: resistenza_ntc
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    calibration:
      b_constant: ${ntc_beta}
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    filters:
      - offset: ${correzione_temp}
      - sliding_window_moving_average:
          window_size: 5
          send_every: 2
    on_value:
      then:
        - lambda: |-
            // sonda valida solo dentro l'intervallo plausibile
            bool ok = !std::isnan(x) && x >= ${temp_min_valida} && x <= ${temp_max_valida};
            id(sonda_valida) = ok;
            id(ultima_lettura) = millis();

  # setpoint come sensore (per il gateway e per lo storico)
  - platform: template
    id: setpoint_attuale
    name: setpoint_attuale
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 15s
    lambda: return id(termostato).target_temperature;

  - platform: wifi_signal
    name: segnale_wifi
    update_interval: 60s

globals:
  - id: sonda_valida
    type: bool
    initial_value: "false"
  - id: ultima_lettura
    type: uint32_t
    initial_value: "0"

binary_sensor:
  - platform: template
    id: sonda_ok
    name: sonda_ok
    lambda: |-
      // valida e aggiornata negli ultimi 10 s
      return id(sonda_valida) && (millis() - id(ultima_lettura) < 10000);

  - platform: template
    id: raffreddamento
    name: raffreddamento
    lambda: return id(rele).state;

# ---------- relè del freddo ----------
switch:
  - platform: gpio
    id: rele
    name: rele_freddo
    pin: ${pin_rele}
    restore_mode: ALWAYS_OFF
    internal: true            # lo comanda solo il termostato, non la pagina web

# ---------- termostato (solo freddo) ----------
climate:
  - platform: thermostat
    id: termostato
    name: termostato
    sensor: temperatura
    on_boot_restore_from: memory          # dopo un'interruzione di corrente riprende il setpoint di prima
    default_target_temperature_high: ${setpoint_iniziale}
    # al primissimo avvio (memoria vuota) parte in modalità freddo con il setpoint iniziale
    preset:
      - name: fermentazione
        mode: COOL
        default_target_temperature_high: ${setpoint_iniziale}
    default_preset: fermentazione
    cool_deadband: ${isteresi}            # il freddo parte a setpoint + isteresi …
    cool_overrun: 0°C                     # … e si ferma al setpoint (come l'STC-1000)
    min_cooling_off_time: ${min_spento}   # tempo minimo da spento prima di ripartire
    min_cooling_run_time: 30s
    min_idle_time: 30s
    cool_action:
      - if:
          condition:
            binary_sensor.is_on: sonda_ok
          then:
            - switch.turn_on: rele
          else:
            - switch.turn_off: rele
    idle_action:
      - switch.turn_off: rele
    visual:
      min_temperature: -2
      max_temperature: 30
      temperature_step: 0.1

# setpoint regolabile dalla pagina web (e leggibile dal gateway in /number/setpoint)
number:
  - platform: template
    id: setpoint
    name: setpoint
    unit_of_measurement: "°C"
    min_value: -2
    max_value: 30
    step: 0.1
    mode: box
    update_interval: 5s
    lambda: return id(termostato).target_temperature;
    set_action:
      - climate.control:
          id: termostato
          mode: COOL
          target_temperature: !lambda return x;

# SICUREZZA: ogni secondo, se la sonda non è valida il relè si spegne (anche se il termostato "vorrebbe" freddo).
# Quando la sonda torna valida e il termostato è ancora in raffreddamento, il relè riparte.
interval:
  - interval: 1s
    then:
      - lambda: |-
          bool ok = id(sonda_ok).state;
          if (!ok && id(rele).state) {
            ESP_LOGW("sicurezza", "Sonda non valida: freddo spento");
            id(rele).turn_off();
          } else if (ok && !id(rele).state && id(termostato).action == climate::CLIMATE_ACTION_COOLING) {
            id(rele).turn_on();
          }

# ---------- display OLED ----------
i2c:
  sda: ${pin_sda}
  scl: ${pin_scl}
  scan: true

font:
  - file: "gfonts://Roboto"
    id: carattere_piccolo
    size: 13
    glyphs: " !%()+,-./0123456789:°ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzàèéìòù"
  - file: "gfonts://Roboto@700"
    id: carattere_grande
    size: 32
    glyphs: " -.,0123456789°C?"

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 1s
    lambda: |-
      it.print(0, 0, id(carattere_piccolo), "${nome_fv}");
      if (id(rele).state) {
        it.print(127, 0, id(carattere_piccolo), TextAlign::TOP_RIGHT, "FREDDO ON");
      } else {
        it.print(127, 0, id(carattere_piccolo), TextAlign::TOP_RIGHT, "freddo off");
      }
      if (id(sonda_ok).state) {
        it.printf(64, 34, id(carattere_grande), TextAlign::CENTER, "%.1f°", id(temperatura).state);
      } else {
        it.print(64, 34, id(carattere_piccolo), TextAlign::CENTER, "SONDA GUASTA");
      }
      it.printf(0, 63, id(carattere_piccolo), TextAlign::BOTTOM_LEFT, "Set %.1f°", id(termostato).target_temperature);
      if (!wifi::global_wifi_component->is_connected()) {
        it.print(127, 63, id(carattere_piccolo), TextAlign::BOTTOM_RIGHT, "no wifi");
      }
